name: Patch reproducibility

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'minthanthtoo/9router'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check the actual PR branch, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test patch tooling and feature catalogue
        run: python3 -B -m unittest discover -s scripts/patches -p 'test_*.py'
      - name: Replay committed changes from official base
        run: python3 -B scripts/patches/export.py --verify --output "$RUNNER_TEMP/9router-patches"
